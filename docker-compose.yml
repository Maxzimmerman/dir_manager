name: "dir_manager"
services:
  dir_ma:
    container_name: python_container
    image: python_image
    volumes:
      - /Users/max/Documents/Documents - Max's MacBook Pro/Private/scan_n8n:/home/node/.n8n-files
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ENABLE_OCR=true
    networks:
      - n8n_n8n-internal
networks:
  n8n_n8n-internal:
    external: true