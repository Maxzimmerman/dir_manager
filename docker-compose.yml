name: "dir_manager"
services:
  dir_ma:
    container_name: python_container
    image: python_image
    restart: always
    volumes:
      - /Users/miniserver/Documents/scans:/home/node/.n8n-files
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ENABLE_OCR=true
    networks:
      - n8n_n8n-internal
networks:
  n8n_n8n-internal:
    external: true
